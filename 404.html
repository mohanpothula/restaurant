<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Maison Lumière</title>
  <!-- GitHub Pages 404 redirect: send every unknown path back to the SPA root -->
  <script>
    // Preserve the path so deep links still land on the right section after redirect
    const path = window.location.pathname;
    const repo = '/restaurant';
    const target = repo + '/' + path.replace(repo, '').replace(/^\//, '');
    // Redirect to root; the main page handles #hash navigation
    sessionStorage.setItem('redirect', window.location.href);
    window.location.replace(repo + '/');
  </script>
  <style>
    body { margin: 0; background: #1a1a2e; color: #c9a96e; font-family: Georgia, serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    h1 { font-size: 4rem; margin: 0 0 0.5rem; }
    p  { font-size: 1.1rem; opacity: .75; }
    a  { color: #c9a96e; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn't exist. Redirecting you to <a href="/restaurant/">Maison Lumière</a>&hellip;</p>
  </div>
</body>
</html>
